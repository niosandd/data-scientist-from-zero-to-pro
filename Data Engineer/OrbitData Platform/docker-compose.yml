name: orbitdata

services:
  # ======================
  # INFRASTRUCTURE
  # ======================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: orbit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - orbitnet
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: orbit-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - orbitnet
    restart: unless-stopped

  # ======================
  # SPARK (profile: spark)
  # ======================
  spark-master:
    image: apache/spark:3.5.3
    container_name: orbit-spark-master
    profiles: [ "spark" ]
    user: root
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8083:8080"
      - "7077:7077"
    volumes:
      - ./spark/jobs:/opt/spark/work-dir/jobs
      - ./storage:/data
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - orbitnet
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.3
    container_name: orbit-spark-worker
    profiles: [ "spark" ]
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./spark/jobs:/opt/spark/work-dir/jobs
      - ./storage:/data
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - orbitnet
    restart: unless-stopped

  # ======================
  # PRODUCERS
  # ======================
  iss-producer:
    build:
      context: ./apps
      dockerfile: Dockerfile
    container_name: orbit-iss-producer
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
    networks:
      - orbitnet
    restart: unless-stopped

  banking-producer:
    build:
      context: ./apps
      dockerfile: Dockerfile
    container_name: orbit-banking-producer
    depends_on:
      - kafka
    command: [ "python", "producers/banking_producer.py" ]
    networks:
      - orbitnet
    restart: unless-stopped

  industrial-producer:
    build:
      context: ./apps
      dockerfile: Dockerfile
    container_name: orbit-industrial-producer
    depends_on:
      - kafka
    command: [ "python", "producers/industrial_producer.py" ]
    networks:
      - orbitnet
    restart: unless-stopped

  # ======================
  # CONSUMERS
  # ======================
  bronze-consumer:
    build:
      context: ./apps
      dockerfile: Dockerfile
    container_name: orbit-bronze-consumer
    depends_on:
      - kafka
      - iss-producer
      - banking-producer
      - industrial-producer
    command: [ "python", "consumers/bronze_consumer.py" ]
    volumes:
      - ./storage:/data
    networks:
      - orbitnet
    restart: unless-stopped

  clickhouse-consumer:
    build:
      context: ./apps
      dockerfile: Dockerfile
    container_name: orbit-clickhouse-consumer
    depends_on:
      - kafka
      - clickhouse
    command: [ "python", "consumers/clickhouse_consumer.py" ]
    networks:
      - orbitnet
    restart: unless-stopped

  # ======================
  # AIRFLOW (profile: airflow)
  # ======================
  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: orbit-airflow-webserver
    profiles: [ "airflow" ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://orbit:orbit_secret@postgres:5432/orbitdata
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    ports:
      - "8082:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./storage:/data
      - /var/run/docker.sock:/var/run/docker.sock   # ← добавить эту строку
    user: root
    command: webserver
    networks:
      - orbitnet
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: orbit-airflow-scheduler
    profiles: [ "airflow" ]
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://orbit:orbit_secret@postgres:5432/orbitdata
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./storage:/data
    networks:
      - orbitnet
    restart: unless-stopped
    user: root
    command: scheduler

  # ======================
  # HIVE (profile: hive)
  # ======================
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: orbit-hive-metastore
    profiles: [ "hive" ]
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/orbitdata
        -Djavax.jdo.option.ConnectionUserName=orbit
        -Djavax.jdo.option.ConnectionPassword=orbit_secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9083:9083"
    networks:
      - orbitnet
    restart: unless-stopped

  hive-server:
    image: apache/hive:3.1.3
    container_name: orbit-hive-server
    profiles: [ "hive" ]
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./storage:/data
    networks:
      - orbitnet
    restart: unless-stopped

  # ======================
  # HADOOP (profile: hadoop)
  # ======================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: orbit-namenode
    profiles: [ "hadoop" ]
    environment:
      - CLUSTER_NAME=orbit
    ports:
      - "9870:9870"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./storage:/data
    networks:
      - orbitnet
    restart: unless-stopped

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: orbit-datanode
    profiles: [ "hadoop" ]
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
      - ./storage:/data
    networks:
      - orbitnet
    restart: unless-stopped

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: orbit-resourcemanager
    profiles: [ "hadoop" ]
    depends_on:
      - namenode
      - datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870 datanode:9864
    ports:
      - "18088:8088"
    networks:
      - orbitnet
    restart: unless-stopped

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: orbit-nodemanager
    profiles: [ "hadoop" ]
    depends_on:
      - resourcemanager
    environment:
      - SERVICE_PRECONDITION=namenode:9870 datanode:9864 resourcemanager:8088
    networks:
      - orbitnet
    restart: unless-stopped

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: orbit-historyserver
    profiles: [ "hadoop" ]
    depends_on:
      - resourcemanager
    environment:
      - SERVICE_PRECONDITION=namenode:9870 resourcemanager:8088
    ports:
      - "8188:8188"
    volumes:
      - hadoop_history:/hadoop/yarn/timeline
    networks:
      - orbitnet
    restart: unless-stopped

  # ======================
  # ELK (profile: elk)
  # ======================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: orbit-elasticsearch
    profiles: [ "elk" ]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - orbitnet
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: orbit-kibana
    profiles: [ "elk" ]
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - orbitnet
    restart: unless-stopped

  # ======================
  # DATABASES
  # ======================
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-orbitdata}
    command: [ "postgres", "-c", "password_encryption=md5" ]   # ← вот сюда
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - orbitnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: orbit-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-orbit}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-orbit_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-orbitdata}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - orbitnet
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: orbit-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./databases/clickhouse/init:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-orbit}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-orbit_secret}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-orbitdata}
    networks:
      - orbitnet
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  # ======================
  # INGESTION
  # ======================
  nifi:
    image: apache/nifi:1.27.0
    container_name: orbit-nifi
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      NIFI_WEB_HTTP_PORT: 8080
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:-admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:-admin1234567890}
    volumes:
      - nifi_data:/opt/nifi/nifi-current
      - ./nifi/flows:/opt/nifi/nifi-current/flows
      - ./storage:/data
    networks:
      - orbitnet
    restart: unless-stopped

  nifi-registry:
    image: apache/nifi-registry:1.27.0
    container_name: orbit-nifi-registry
    ports:
      - "18081:18080"
    volumes:
      - nifi_registry_data:/opt/nifi-registry/nifi-registry-current
    networks:
      - orbitnet
    restart: unless-stopped

  ftp:
    image: stilliard/pure-ftpd:hardened
    container_name: orbit-ftp
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    environment:
      PUBLICHOST: localhost
      FTP_USER_NAME: orbit
      FTP_USER_PASS: orbit_secret
      FTP_USER_HOME: /home/ftpuser
    volumes:
      - ./storage/bronze/ftp:/home/ftpuser
    networks:
      - orbitnet
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    container_name: orbit-logstash
    profiles: [ "elk" ]
    depends_on:
      - elasticsearch
    ports:
      - "5044:5044"
      - "8089:8089"
      - "9600:9600"
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - xpack.monitoring.enabled=false
    networks:
      - orbitnet
    restart: unless-stopped

  # ======================
  # MONITORING
  # ======================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: orbit-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - orbitnet
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: orbit-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - orbitnet
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    container_name: orbit-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - orbitnet
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    container_name: orbit-promtail
    volumes:
      - ./monitoring/promtail:/etc/promtail
      - ./storage/logs:/var/log/orbit
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - orbitnet
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: orbit-alertmanager
    ports:
      - "9095:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    networks:
      - orbitnet
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: orbit-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - orbitnet
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: orbit-kafka-exporter
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:9092'
    depends_on:
      - kafka
    networks:
      - orbitnet
    restart: unless-stopped

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  postgres_data:
  mongo_data:
  clickhouse_data:
  nifi_data:
  nifi_registry_data:
  prometheus_data:
  grafana_data:
  loki_data:
  hadoop_namenode:
  hadoop_datanode:
  hadoop_history:
  elasticsearch_data:

networks:
  orbitnet:
    driver: bridge