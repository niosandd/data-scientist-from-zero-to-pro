version: "3.8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ====================== INFRASTRUCTURE ======================

  # ====================== EFK (профиль elk) ======================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: msdp-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - msdp-net
    profiles:
      - elk
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: msdp-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - msdp-net
    profiles:
      - elk
    restart: unless-stopped

  # ====================== HADOOP (профиль hadoop) ======================

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: msdp-namenode
    environment:
      - CLUSTER_NAME=msdp
    env_file:
      - ../hadoop/hadoop.env
    ports:
      - "9870:9870"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ../hadoop/data:/data
      - ../hadoop/streaming:/streaming
    networks:
      - msdp-net
    profiles:
      - hadoop
    restart: unless-stopped

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: msdp-datanode
    env_file:
      - ../hadoop/hadoop.env
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - msdp-net
    profiles:
      - hadoop
    restart: unless-stopped

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: msdp-resourcemanager
    env_file:
      - ../hadoop/hadoop.env
    ports:
      - "18088:8088"
    depends_on:
      - namenode
      - datanode
    networks:
      - msdp-net
    profiles:
      - hadoop
    restart: unless-stopped

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: msdp-nodemanager
    env_file:
      - ../hadoop/hadoop.env
    depends_on:
      - namenode
      - datanode
      - resourcemanager
    networks:
      - msdp-net
    profiles:
      - hadoop
    restart: unless-stopped

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: msdp-historyserver
    env_file:
      - ../hadoop/hadoop.env
    ports:
      - "8188:8188"
    volumes:
      - hadoop_history:/hadoop/yarn/timeline
    depends_on:
      - namenode
      - resourcemanager
    networks:
      - msdp-net
    profiles:
      - hadoop
    restart: unless-stopped

  fluentd:
    image: fluent/fluentd-kubernetes-daemonset:v1-debian-elasticsearch
    container_name: msdp-fluentd
    volumes:
      - ../monitoring/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - ../storage/logs:/var/log/msdp
    environment:
      - FLUENTD_CONF=fluent.conf
      # этот image по умолчанию ждёт K8s; отключим лишнее, если мешает
      - FLUENT_ELASTICSEARCH_HOST=elasticsearch
      - FLUENT_ELASTICSEARCH_PORT=9200
      - FLUENT_ELASTICSEARCH_SCHEME=http
      - FLUENT_ELASTICSEARCH_SSL_VERIFY=false
    depends_on:
      - elasticsearch
    networks:
      - msdp-net
    profiles:
      - elk
    restart: unless-stopped
    command: fluentd -c /fluentd/etc/fluent.conf -v

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: msdp-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - msdp-net
    logging: *default-logging
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: msdp-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - msdp-net
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: msdp-kafka-exporter
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:9092
    depends_on:
      - kafka
    networks:
      - msdp-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: msdp-kafka
    ports:
      - "9092:9092"
      - "19092:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://host.docker.internal:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - msdp-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  producer:
    build:
      context: ..
      dockerfile: apps/Dockerfile
    container_name: msdp-producer
    depends_on:
      - kafka
    networks:
      - msdp-net
    restart: unless-stopped

  ftp:
    image: stilliard/pure-ftpd:hardened
    container_name: msdp-ftp
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    environment:
      PUBLICHOST: "localhost"
      FTP_USER_NAME: ${FTP_USER:-msdp}
      FTP_USER_PASS: ${FTP_PASSWORD:-msdp_secret}
      FTP_USER_HOME: "/home/msdp"
      ADDED_FLAGS: "-d -d"
    volumes:
      - ../storage/ftp_inbox:/home/msdp
    networks:
      - msdp-net
    restart: unless-stopped

  nifi-registry:
    image: apache/nifi-registry:1.27.0
    container_name: msdp-nifi-registry
    ports:
      - "18081:18080"
    environment:
      NIFI_REGISTRY_WEB_HTTP_PORT: 18080
    networks:
      - msdp-net
    restart: unless-stopped

  consumer:
    build:
      context: ..
      dockerfile: apps/Dockerfile
    container_name: msdp-consumer
    command: python apps/consumers/iss_consumer.py
    depends_on:
      - kafka
      - mongo
    volumes:
      - ../storage:/app/storage
    networks:
      - msdp-net
    restart: unless-stopped

  # ====================== DATABASES ======================

  postgres:
    image: postgres:16-alpine
    container_name: msdp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-msdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-msdp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-msdp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../databases/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - msdp-net
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-msdp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: msdp-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-msdp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-msdp_secret}
    volumes:
      - mongo_data:/data/db
    networks:
      - msdp-net
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================== INGESTION ======================

  nifi:
    image: apache/nifi:1.27.0
    container_name: msdp-nifi
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_USER:-admin}
      - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_PASSWORD:-admin1234567890}
      - NIFI_SENSITIVE_PROPS_KEY=${NIFI_SENSITIVE_PROPS_KEY:-msdp_nifi_key_123456}
    volumes:
      - nifi_data:/opt/nifi/nifi-current
      - ../nifi/flows:/opt/nifi/nifi-current/flows
      - ../storage:/data/storage
    networks:
      - msdp-net
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # ====================== MONITORING ======================

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: msdp-prometheus
    ports:
      - "9091:9090"          # снаружи будет 9091
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - msdp-net
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: msdp-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - msdp-net
    logging: *default-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    container_name: msdp-loki
    ports:
      - "3100:3100"
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - msdp-net
    logging: *default-logging
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    container_name: msdp-promtail
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - msdp-net
    logging: *default-logging
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: msdp-alertmanager
    ports:
      - "9095:9093"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ../monitoring/alertmanager/pagerduty_key:/etc/alertmanager/pagerduty_key:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - msdp-net
    logging: *default-logging
    restart: unless-stopped

  # ====================== PROXY ======================

  nginx:
    image: nginx:1.27-alpine
    container_name: msdp-nginx
    ports:
      - "8088:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - grafana
      - nifi
    networks:
      - msdp-net
    logging: *default-logging
    restart: unless-stopped

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  postgres_data:
  mongo_data:
  nifi_data:
  prometheus_data:
  grafana_data:
  loki_data:
  nifi_registry_data:
  nifi_registry_flow_storage:
  elasticsearch_data:
  hadoop_namenode:
  hadoop_datanode:
  hadoop_history:

networks:
  msdp-net:
    driver: bridge
    name: msdp-net