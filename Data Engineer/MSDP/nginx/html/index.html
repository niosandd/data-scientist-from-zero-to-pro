<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MSDP — Multi-Source Data Platform</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1a73e8; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; }
        a { color: #1a73e8; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <h1>🚀 Multi-Source Data Platform (MSDP)</h1>
    <p>Пет-проект Data Engineer (Skillbox)</p>

    <div class="card">
        <h3>Сервисы</h3>
        <ul>
            <li><a href="http://localhost:3000" target="_blank">Grafana</a> (admin / admin)</li>
            <li><a href="http://localhost:8080/nifi" target="_blank">Apache NiFi</a></li>
            <li><a href="http://localhost:9090" target="_blank">Prometheus</a></li>
            <li><a href="http://localhost:3100" target="_blank">Loki</a></li>
        </ul>
    </div>

    <div class="card">
        <h3>Базы данных</h3>
        <ul>
            <li>PostgreSQL — localhost:5432 (msdp / msdp_secret)</li>
            <li>MongoDB — localhost:27017 (msdp / msdp_secret)</li>
            <li>Kafka — localhost:9093</li>
        </ul>
    </div>
</body>
</html>
