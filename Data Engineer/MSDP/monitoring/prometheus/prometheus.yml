global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

#  - job_name: "kafka"
#    static_configs:
#      - targets: ["kafka:9092"]

  - job_name: "nifi"
    metrics_path: /metrics
    static_configs:
      - targets: ["nifi:8080"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "mongo"
    static_configs:
      - targets: ["mongo:27017"]

  - job_name: "cadvisor"
    static_configs:
      - targets: [ "cadvisor:8080" ]

  - job_name: "kafka-exporter"
    static_configs:
      - targets: [ "kafka-exporter:9308" ]