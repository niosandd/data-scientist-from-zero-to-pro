<source>
  @type tail
  path /var/log/msdp/*.log
  pos_file /fluentd/log/msdp.pos
  tag msdp.app
  read_from_head true
  <parse>
    @type none
  </parse>
</source>

<match msdp.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  ssl_verify false
  logstash_format true
  logstash_prefix msdp
  reload_connections false
  reconnect_on_error true
  reload_on_failure true
  <buffer>
    @type memory
    flush_interval 5s
  </buffer>
</match>