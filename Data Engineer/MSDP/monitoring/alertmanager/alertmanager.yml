global:
  resolve_timeout: 5m

route:
  receiver: pagerduty-msdp
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: pagerduty-msdp
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/pagerduty_key
        description: '{{ .CommonAnnotations.summary }}'
        severity: error
        details:
          alertname: '{{ .CommonLabels.alertname }}'
          job: '{{ .CommonLabels.job }}'
          instance: '{{ .CommonLabels.instance }}'